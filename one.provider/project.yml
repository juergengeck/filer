name: OneFiler
options:
  bundleIdPrefix: one.filer
  deploymentTarget:
    macOS: "13.0"
  developmentLanguage: en

settings:
  SWIFT_VERSION: "5.9"
  MARKETING_VERSION: "1.0.1"
  CURRENT_PROJECT_VERSION: "5"
  MACOSX_DEPLOYMENT_TARGET: "13.0"
  DEVELOPMENT_TEAM: "26W8AC52QS"
  CODE_SIGN_STYLE: Automatic
  CODE_SIGN_IDENTITY: "Apple Development"
  ENABLE_HARDENED_RUNTIME: YES
  REGISTER_APP_GROUPS: YES

targets:
  # Main app target (owns domain registration and embeds the extension)
  OneFilerHost:
    type: application
    platform: macOS
    deploymentTarget: "13.0"
    sources:
      - path: Sources/OneFilerShared
      - path: Sources/OneFilerHost
      - path: Resources/Assets.xcassets
        buildPhase: resources
      - path: Resources/Olive.icns
        buildPhase: resources
    settings:
      # Use the appearance-aware ICNS file; XcodeGen otherwise defaults to AppIcon.
      ASSETCATALOG_COMPILER_APPICON_NAME: ""
      PRODUCT_BUNDLE_IDENTIFIER: one.filer
      INFOPLIST_FILE: Resources/Info.plist
      COMBINE_HIDPI_IMAGES: YES
      CODE_SIGN_ENTITLEMENTS: Resources/OneFiler.entitlements
    entitlements:
      path: Resources/OneFiler.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.application-groups:
          - group.one.filer
        com.apple.security.network.client: true
    postBuildScripts:
      - name: Embed owned Node runtime
        script: |
          set -eu
          RUNTIME="$SRCROOT/build/native-runtime"
          test -f "$RUNTIME/node" || { echo "Run npm run prepare:runtime with NODE_BINARY set before building" >&2; exit 1; }
          mkdir -p "$TARGET_BUILD_DIR/$CONTENTS_FOLDER_PATH/Resources"
          rm -rf "$TARGET_BUILD_DIR/$CONTENTS_FOLDER_PATH/Resources/runtime"
          ditto "$RUNTIME/runtime" "$TARGET_BUILD_DIR/$CONTENTS_FOLDER_PATH/Resources/runtime"
          cp "$RUNTIME/node" "$TARGET_BUILD_DIR/$EXECUTABLE_FOLDER_PATH/node"
          if [ "${CODE_SIGNING_ALLOWED:-YES}" != "NO" ]; then
            codesign --force --sign "$EXPANDED_CODE_SIGN_IDENTITY" --options runtime --entitlements "$SRCROOT/Resources/Node.entitlements" "$TARGET_BUILD_DIR/$EXECUTABLE_FOLDER_PATH/node"
          fi
        basedOnDependencyAnalysis: false
    dependencies:
      - target: OneFilerExtension
        embed: true

  # File Provider Extension target
  OneFilerExtension:
    type: app-extension
    platform: macOS
    deploymentTarget: "13.0"
    sources:
      - path: Sources/OneFilerShared
      - path: Sources/OneFiler
        excludes:
          - "**/*.md"
      - path: Resources/Assets.xcassets
        buildPhase: resources
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: one.filer.extension
      INFOPLIST_FILE: Resources/ExtensionInfo.plist
      COMBINE_HIDPI_IMAGES: YES
      SKIP_INSTALL: NO
      CODE_SIGN_ENTITLEMENTS: Resources/Extension.entitlements
    entitlements:
      path: Resources/Extension.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.application-groups:
          - group.one.filer
        com.apple.security.files.user-selected.read-write: true
    dependencies: []
